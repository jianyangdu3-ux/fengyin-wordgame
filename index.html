<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>凤印九重 · 宫斗背词</title>
<style>
:root{
  --bg:#FAF6EF; --bg-card:#FFFDF8; --ink:#3A2A2A; --ink2:#7A6A5F;
  --red:#8E2B2B; --red2:#B54A3A; --gold:#C9A227; --gold2:#E4C87A;
  --line:#E5D5B8; --line2:#D9C3A0; --danger:#B33A3A; --ok:#3E7A4E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%}
body{
  background:#2E2222; font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); display:flex; justify-content:center;
}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column}
.header-wrap{position:sticky;top:0;z-index:50}
header.topbar{
  background:linear-gradient(180deg,#7A1F1F,#8E2B2B);
  color:#F5E9C9;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.topbar h1{font-size:19px;letter-spacing:2px;font-weight:600}
.topbar .sub{font-size:13px;color:#E4C87A;margin-top:3px;display:flex;justify-content:space-between;align-items:center}
.topbar .fav{font-size:12px;color:#F5E9C9;background:rgba(255,255,255,.12);border:1px solid rgba(228,200,122,.5);padding:2px 8px;border-radius:10px}
.rank-bar{
  display:flex;gap:6px;overflow-x:auto;padding:8px 14px;
  background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none;
}
.rank-bar::-webkit-scrollbar{display:none}
.rank-chip{flex:0 0 auto;font-size:12px;color:var(--ink2);border:1px solid var(--line2);background:var(--bg-card);padding:4px 12px;border-radius:14px;white-space:nowrap;font-weight:500}
.rank-chip.cur{background:var(--red);color:#F5E9C9;border-color:var(--red);font-weight:500}
.rank-chip.past{color:var(--red);border-color:var(--red2);background:#FBEEE8}
main{flex:1;padding:14px 14px 84px}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes stamp{0%{transform:scale(2) rotate(-10deg);opacity:0}60%{transform:scale(1) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{font-size:15px;color:var(--red);font-weight:500;margin-bottom:8px;letter-spacing:1px}
.panel h2 .en{color:var(--gold);font-size:12px;margin-left:6px;font-weight:400}
.p-text{font-size:14.5px;line-height:2;color:var(--ink);text-indent:2em}
.gword{color:var(--red);border-bottom:1px dashed var(--red2);cursor:pointer;font-weight:500}
.gword:active{background:var(--gold2)}
.btn{
  display:block;width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;letter-spacing:2px;
  background:var(--red);color:#F5E9C9;cursor:pointer;margin-top:12px;
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--bg-card);color:var(--red);border:1px solid var(--red2)}
.btn.gold{background:var(--gold);color:#3A2A2A}
.btn:disabled{opacity:.45}
.quiz-word{font-size:26px;font-weight:500;color:var(--red);text-align:center;letter-spacing:1px;cursor:pointer;-webkit-tap-highlight-color:rgba(201,162,39,.2)}
.quiz-word:active{transform:scale(.97);transition:transform .1s}
.word-wrap{display:flex;align-items:center;justify-content:center;gap:8px}
.speak-icon{font-size:22px;background:none;border:none;cursor:pointer;padding:4px 8px;color:var(--gold);line-height:1}
.speak-icon:active{transform:scale(.9)}
.quiz-pho{text-align:center;color:var(--ink2);font-size:14px;margin:6px 0 2px}
.quiz-pos{text-align:center;font-size:12px;color:var(--gold);margin-bottom:14px}
.qopt{
  display:block;width:100%;text-align:left;background:var(--bg-card);border:1px solid var(--line2);
  border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink);margin-top:10px;cursor:pointer;line-height:1.5;
}
.qopt:active{background:#FBEEE8}
.qopt .pos{color:var(--gold);margin-right:6px;font-size:12.5px}
.qopt.right{background:#E8F3EA;border-color:var(--ok);color:var(--ok)}
.qopt.wrong{background:#FBE9E9;border-color:var(--danger);color:var(--danger)}
.progress{display:flex;gap:4px;margin-bottom:12px}
.pdot{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pdot.done{background:var(--red)}
.pdot.cur{background:var(--gold)}
.hp-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hp-name{font-size:13px;color:var(--ink2)}
.hp-bar{flex:1;height:10px;background:#F0E4D0;border-radius:5px;margin:0 10px;overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,var(--red2),var(--red));border-radius:5px;transition:width .3s}
.hp-fill.friend{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.battle-title{text-align:center;font-size:15px;color:var(--red);font-weight:500;margin:6px 0 2px}
.battle-sub{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:10px}
.battle-log{font-size:13px;color:var(--ink2);text-align:center;min-height:20px;margin-top:10px;line-height:1.6}
.letter{
  background:#F4E8CF;border:1px solid var(--gold);border-radius:10px;padding:14px;font-family:Georgia,serif;
  font-size:15px;line-height:1.9;color:#5A4632;margin:10px 0;
}
.letter .gword{color:#8E5A1E;border-color:#C9A227}
.reward-big{text-align:center;padding:20px 0 6px}
.reward-big .rn{font-size:34px;color:var(--red);font-weight:500;letter-spacing:4px}
.reward-big .rf{font-size:13px;color:var(--gold);margin-top:6px}
.stats-row{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:#FBEEE8;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--red);font-weight:500}
.stat span{font-size:11px;color:var(--ink2)}
nav.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:60;
  background:var(--bg-card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;padding:9px 0 8px;text-align:center;font-size:11px;color:var(--ink2);cursor:pointer;background:none;border:none}
.tab .ti{display:block;font-size:16px;line-height:1.3}
.tab.active{color:var(--red)}
.tab.active .ti{transform:translateY(-1px)}
.library-top{position:sticky;top:120px;z-index:30;background:var(--bg);padding:4px 0 10px}
.lib-search{
  width:100%;padding:10px 14px;border:1px solid var(--line2);border-radius:12px;font-size:14px;
  background:var(--bg-card);color:var(--ink);outline:none;
}
.lib-list{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lib-item{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.lib-item:last-child{border-bottom:none}
.lib-item .w{font-size:14px;color:var(--ink);font-weight:500}
.lib-item .d{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-item .pos{color:var(--gold);font-size:11px;margin-right:4px}
.lib-empty{text-align:center;color:var(--ink2);padding:30px 0;font-size:13px}
.rec-item{border-left:3px solid var(--gold);background:var(--bg-card);border:1px solid var(--line);border-left-color:var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rec-item .q{font-size:13.5px;color:var(--ink);line-height:1.7}
.rec-item .a{font-size:12px;color:var(--ok);margin-top:6px}
.rec-item .a.bad{color:var(--danger)}
.sheet-mask{position:fixed;inset:0;background:rgba(46,34,34,.5);z-index:90;display:none}
.sheet{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:91;
  background:var(--bg-card);border-radius:18px 18px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(0,0,0,.15);
  max-height:80vh;overflow-y:auto;
}
.sheet .sw{font-size:24px;color:var(--red);font-weight:500}
.sheet .sp{font-size:13px;color:var(--ink2);margin:4px 0 10px}
.sheet .sd{font-size:15px;line-height:1.9;color:var(--ink)}
.sheet .btn{margin-top:16px}
.sheet .btn:last-child{margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:120;max-width:330px;width:max-content;
  background:rgba(46,34,34,.92);color:#F5E9C9;font-size:13px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
.cover{text-align:center;padding:16px 10px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 120px)}
.cover .logo{
  font-size:28px;color:var(--red);letter-spacing:6px;font-weight:500;margin:12px 0 4px;
}
.cover .sublogo{font-size:12px;color:var(--gold);letter-spacing:4px;margin-bottom:18px}
.cover .desc{font-size:13px;color:var(--ink2);line-height:1.75;text-align:left;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 4px 14px}
.cover .desc b{color:var(--red);font-weight:500}
.seal{
  width:84px;height:84px;border:3px solid var(--red);border-radius:10px;margin:0 auto 6px;display:flex;
  align-items:center;justify-content:center;color:var(--red);font-size:26px;letter-spacing:2px;transform:rotate(-4deg);
}
.chap-title{text-align:center;font-size:16px;color:var(--red);font-weight:500;letter-spacing:3px;margin:8px 0 2px}
.chap-sub{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:12px}
.hint{font-size:12px;color:var(--ink2);text-align:center;margin-top:10px;line-height:1.7}
.task-panel{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;text-align:left}
.task-title{font-size:13px;color:var(--red);font-weight:500;margin-bottom:8px;letter-spacing:1px}
.task-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.task-item:last-child{border-bottom:none}
.task-label{font-size:12px;color:var(--ink)}
.task-bar{flex:1;height:6px;background:var(--line);border-radius:3px;margin:0 10px;overflow:hidden}
.task-fill{height:100%;background:var(--gold);border-radius:3px;transition:width .4s}
.task-num{font-size:11px;color:var(--ink2);min-width:36px;text-align:right}
.task-check{font-size:14px;color:var(--ok);margin-left:6px}
.task-reward{margin-top:10px;text-align:center}
.char-box{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;animation:fadeIn .4s ease}
.char-emoji{font-size:36px;line-height:1}
.char-info{flex:1}
.char-name{font-size:13px;color:var(--red);font-weight:500}
.char-quote{font-size:11px;color:var(--ink2);margin-top:2px;font-style:italic}
.anim-pop{animation:pop .3s ease}
.anim-shake{animation:shake .3s ease}
.seal-stamp{animation:stamp .5s ease forwards}
.coin-float{position:fixed;pointer-events:none;font-size:20px;animation:floatUp .8s ease forwards;z-index:200}
.qopt.right{background:#E8F5E9!important;color:#2E7D32!important;border-color:#A5D6A7!important;animation:pop .25s ease}
.qopt.wrong{background:#FFEBEE!important;color:#C62828!important;border-color:#EF9A9A!important;animation:shake .3s ease}
/* 考校结果面板 */
.quiz-result{text-align:center;padding:16px 12px}
.result-stamp{display:inline-block;font-size:22px;font-weight:600;padding:8px 28px;border-radius:24px;margin-bottom:12px}
.result-stamp.pass{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);color:#2E7D32;border:1px solid #A5D6A7}
.result-stamp.fail{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);color:#C62828;border:1px solid #EF9A9A}
.result-score{font-size:15px;color:var(--ink);margin-bottom:10px}
.result-score b{font-size:18px;color:var(--red)}
.result-wrong-title{font-size:13px;color:var(--muted);margin:10px 0 6px}
.result-wrong-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.result-wrong-item{background:#FFFDF8;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;text-align:left}
.result-word{font-size:15px;font-weight:500;color:var(--red)}
.result-def{font-size:12.5px;color:var(--muted);margin-top:2px}
/* 角色台词 */
.quiz-char{display:flex;align-items:flex-start;gap:8px;background:linear-gradient(135deg,#FBEEE8,#FFFDF8);border:1px solid var(--line2);border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;margin-bottom:12px;animation:fadeIn .3s ease}
.quiz-char-emoji{font-size:28px;line-height:1;flex-shrink:0}
.quiz-char-line{font-size:13px;color:var(--ink);line-height:1.6;font-style:italic;flex:1;padding-top:4px}
/* 卷轴效果 */
.scroll-panel{position:relative;background:linear-gradient(180deg,#F4E8CF 0%,#FFFDF8 8%,#FFFDF8 92%,#F4E8CF 100%);border:1px solid var(--gold);border-radius:6px;padding:22px 16px 20px}
.scroll-panel::before,.scroll-panel::after{content:'';display:block;position:absolute;left:-2px;right:-2px;height:8px;background:linear-gradient(180deg,#C9A227,#8E5A1E,#C9A227);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.scroll-panel::before{top:-5px}
.scroll-panel::after{bottom:-5px}
.scroll-corner{position:absolute;width:16px;height:16px;border:2px solid var(--gold);border-radius:50%;opacity:.35;pointer-events:none}
.scroll-corner.tl{top:8px;left:8px}
.scroll-corner.tr{top:8px;right:8px}
.scroll-corner.bl{bottom:8px;left:8px}
.scroll-corner.br{bottom:8px;right:8px}
/* 拼写题 */
.spell-hint{font-size:16px;color:var(--red);text-align:center;margin-bottom:12px;font-weight:500;line-height:1.6}
.spell-input{width:100%;padding:14px;border:2px solid var(--line2);border-radius:12px;font-size:20px;text-align:center;letter-spacing:2px;color:var(--ink);background:var(--bg-card);outline:none;font-family:Georgia,serif;transition:border-color .2s}
.spell-input:focus{border-color:var(--red)}
.spell-input.right{border-color:var(--ok);background:#E8F5E9;color:var(--ok)}
.spell-input.wrong{border-color:var(--danger);background:#FFEBEE;color:var(--danger);animation:shake .3s ease}
.spell-tip{font-size:12px;color:var(--ink2);text-align:center;margin:8px 0 10px;line-height:1.6}

/* ===== 古风视觉升级 ===== */
/* 宣纸暖色背景 */
#app{background:linear-gradient(180deg,#FAF5E8 0%,#F5EDD0 50%,#FAF5E8 100%)}
/* 宋体标题 */
.cover .logo,.chap-title,.battle-title,.letter,.reward-big .rn{font-family:"Songti SC","STSong","SimSun","Hiragino Mincho ProN","Yu Mincho",serif}
/* 角色卡片重做 */
.char-box{
  background:linear-gradient(135deg,#FFFDF8,#F4ECD8);
  border:2px solid #C9A227;
  border-radius:14px;
  padding:12px 14px;
  position:relative;
  box-shadow:0 2px 12px rgba(142,43,43,.08);
  overflow:hidden;
  align-items:flex-start;
}
.char-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#C9A227,#E4C87A,#C9A227,transparent);
}
.char-box::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#C9A227,transparent);
}
.char-img{
  width:76px;height:110px;object-fit:cover;border-radius:8px;
  border:2px solid #C9A227;box-shadow:0 2px 8px rgba(0,0,0,.15);
  flex-shrink:0;background:#FFFDF8;
}
/* 测验角色 */
.quiz-char{
  background:linear-gradient(135deg,#FBEEE8,#FFFDF8);
  border:1px solid var(--line2);
  border-left:3px solid var(--red);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:12px;
  animation:fadeIn .3s ease;
  display:flex;
  align-items:flex-start;
  gap:10px;
  position:relative;
  overflow:hidden;
}
.quiz-char-img{
  width:56px;height:80px;object-fit:cover;border-radius:6px;
  border:2px solid #C9A227;box-shadow:0 2px 6px rgba(0,0,0,.12);flex-shrink:0;
}
.quiz-char-line-wrap{flex:1;padding-top:4px}
/* 斗法敌人角色 */
.enemy-char{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.enemy-char-img{width:64px;height:90px;object-fit:cover;border-radius:8px;border:2px solid #C9A227;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-shrink:0}
.enemy-char-info{flex:1}
.enemy-char-name{font-size:13px;color:var(--red);font-weight:500}
.enemy-char-quote{font-size:11px;color:var(--ink2);margin-top:2px;font-style:italic}
/* 面板装饰 */
.panel{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFFDF8,#F8F0E0);
  box-shadow:0 2px 14px rgba(142,43,43,.06);
}
.panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#C9A227,#E4C87A,#C9A227,transparent);
}
/* 封面氛围 */
.cover .seal{
  background:linear-gradient(135deg,#FFFDF8,#F8F0E0);
  box-shadow:0 2px 12px rgba(122,31,31,.12);
  position:relative;
}
.cover .seal::before{
  content:'';position:absolute;inset:-3px;border:1px solid #C9A227;border-radius:13px;opacity:.5;
}
/* 装饰线 */
.decor-line{
  width:100%;height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent);
  margin:10px 0;
}
/* 回纹角花 */
.corner-flower{
  position:absolute;width:20px;height:20px;opacity:.3;pointer-events:none;
}
.corner-flower.tl{top:4px;left:4px}
.corner-flower.tr{top:4px;right:4px}
.corner-flower.bl{bottom:4px;left:4px}
.corner-flower.br{bottom:4px;right:4px}
/* 封面宫殿剪影 */
.palace-silhouette{
  width:100%;height:80px;opacity:.08;pointer-events:none;margin-bottom:-8px;
}
</style>
</head>
<body>
<div id="app">
  <div class="header-wrap">
    <header class="topbar">
      <h1>凤印九重</h1>
      <div class="sub"><span id="rankName">秀女</span><span id="sealText" style="color:var(--gold);font-size:11px;margin-left:6px;"></span><span class="fav" id="favText">圣宠 0</span></div>
    </header>
    <div class="rank-bar" id="rankBar"></div>
  </div>

  <main id="main">
    <div class="page active" id="page-start">
      <div class="cover">
        <div class="palace-silhouette">
          <svg viewBox="0 0 430 100" preserveAspectRatio="xMidYMax slice" width="100%" height="100%">
            <path d="M0 100 L0 70 L50 50 L100 70 L150 45 L215 20 L280 45 L330 70 L380 50 L430 70 L430 100Z" fill="#7A1F1F"/>
          </svg>
        </div>
        <div class="seal">凤印</div>
        <div class="decor-line"></div>
        <div class="logo">凤印九重</div>
        <div class="sublogo">宫 斗 背 词 · 考 研 篇</div>
        <div class="desc">
          大周选秀，<b>5491 个考研核心词</b>藏在这深宫的一砖一瓦里。<br>
          你本是寒门女子，入宫只为活命——<b>记不住词，就活不过这一章</b>。<br>
          从秀女到皇后九重位份，每晋一级<b>获赐一枚凤印</b>。
        </div>
        <button class="btn gold" id="btnStart" onclick="startGame()">入 宫 选 秀</button>

/* ---------- 工具 ---------- */
function $(id){return document.getElementById(id);}
function extractPOS(def){
  var m=/^([a-zA-Z.]+)\s*(.*)$/.exec(def||'');
  if(m) return {pos:m[1], mean:m[2]};
  return {pos:'',mean:def||''};
}

}

/* ---------- 每日任务 ---------- */
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function initTasks(){
  if(!S.tasks) S.tasks={date:'',done:[0,0,0],claimed:[0,0,0]};
  var t=todayStr();
  if(S.tasks.date!==t){
    S.tasks={date:t,done:[0,0,0],claimed:[0,0,0]};
    save();
  }
}
function getTasks(){
  initTasks();
  return [
    {label:'背词 20 个', target:20, key:'words'},
    {label:'答对 10 题', target:10, key:'correct'},
    {label:'晋升 1 级', target:1, key:'promote'}
  ];
}
function renderTasks(){
  var list=$('taskList'); if(!list) return;
  var tasks=getTasks(); var h=''; var allDone=true;
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i]; var done=S.tasks.done[i]||0; var pct=Math.min(100,Math.round(done/t.target*100));
    var finished=done>=t.target;
    if(!finished) allDone=false;
    h+='<div class="task-item">'+
      '<span class="task-label">'+(finished?'✅ ':'')+t.label+'</span>'+
      '<div class="task-bar"><div class="task-fill" style="width:'+pct+'%"></div></div>'+
      '<span class="task-num">'+done+'/'+t.target+'</span>'+
      '</div>';
  }
  list.innerHTML=h;
  var panel=$('taskPanel'); if(panel) panel.style.display='block';
  var reward=$('taskReward');
  if(reward) reward.style.display=(allDone && !S.tasks.claimed[0])?'block':'none';
}
function claimTaskReward(){
  S.tasks.claimed=[1,1,1];

  toast('领取赏赐 +30 圣宠！');
  renderTasks(); renderRankBar();
}
function taskInc(key,n){
  initTasks();
  var tasks=getTasks();
  for(var i=0;i<tasks.length;i++){
    if(tasks[i].key===key){
      S.tasks.done[i]=(S.tasks.done[i]||0)+(n||1);
      if(S.tasks.done[i]>tasks[i].target) S.tasks.done[i]=tasks[i].target;
    }
  }
  save();
  renderTasks();
}

}

  span.className='coin-float';

  span.style.left=(r.left+r.width/2)+'px';
  span.style.top=(r.top)+'px';
  document.body.appendChild(span);
  setTimeout(function(){span.remove();},900);
}
/* ---------- 音频初始化（解决 iOS/微信自动播放限制） ---------- */
var audioCtx=null;
function initAudio(){
  if(!audioCtx){
    try{ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume().catch(function(){}); }
}
/* 首次用户交互时解锁音频 */
function onceAudioUnlock(){
  initAudio();
  document.removeEventListener('touchstart',onceAudioUnlock);
  document.removeEventListener('click',onceAudioUnlock);
}
document.addEventListener('touchstart',onceAudioUnlock,{passive:true});
document.addEventListener('click',onceAudioUnlock);

function speak(word){
  if(!word) return;
  initAudio();
  // 优先 Web Speech API（iOS 更可靠）
  try{
    if(window.speechSynthesis){
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(word);
      u.lang='en-US';
      u.rate=0.85;
      speechSynthesis.speak(u);
      return;
    }
  }catch(e){}
  // fallback 到有道
  try{
    var url='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(word)+'&type=2';
    var a=new Audio(url);
    a.play().catch(function(){});
  }catch(e){}
}
function speakWord(){
  var w;
  if(cur && cur.stage==='quiz') w=cur.items[cur.i].word;
  else if(cur && cur.stage==='battle') w=cur.q.word;

  if(!w) return;
  speak(w);
  toast('🔊 发音：'+w);
}
function speakSpell(){
  var w=cur && cur.items ? cur.items[cur.i].word : '';

/* ---------- 剧情词高亮 ---------- */
function linkWords(text, words, cls){
  var out=text;
  (words||[]).forEach(function(w){
    var key=String(w).toLowerCase();
    if(!VOCAB_MAP[key]) return;
    var re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    if(out.match(re) && !out.includes('<span')){
      out=out.replace(re,'<span class="gword '+cls+'" data-w="'+key+'">$1</span>');
    }
  });
  return out;
}
function bindWordClicks(root){
  var spans=root?root.querySelectorAll('.gword'):document.querySelectorAll('.gword');
  for(var i=0;i<spans.length;i++){
    spans[i].onclick=function(){ openSheet(this.getAttribute('data-w')); };
  }
}

/* ---------- 测验（词关） ---------- */
function makeOptions(word, count, mode){
  var ans=VOCAB_MAP[word];
  var p=extractPOS(ans.def);
  var pool=[];
  var keys=Object.keys(VOCAB_MAP);
  var tries=0;
  while(pool.length<count-1 && tries<keys.length*3){
    tries++;
    var k=keys[rand(keys.length)];
    if(k===word) continue;
    var o=VOCAB_MAP[k];
    var op=extractPOS(o.def);
    if(mode==='en2zh' && op.pos!==p.pos) continue;
    if(mode==='zh2en' && op.pos!==p.pos) continue;
    if(pool.indexOf(k)===-1) pool.push(k);
  }
  var opts=[];
  var wrong=pool.slice(0,count-1);
  wrong.forEach(function(k){
    var o=VOCAB_MAP[k]; var op=extractPOS(o.def);
    opts.push({k:k,label:mode==='en2zh'?op.mean:(mode==='zh2en'?o.word:o.word),pos:op.pos,is:false});
  });
  opts.push({k:word,label:mode==='en2zh'?p.mean:(mode==='zh2en'?ans.word:ans.word),pos:p.pos,is:true});
  for(var i=opts.length-1;i>0;i--){var j=rand(i+1);var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
  return opts;
}
function buildOptsHTML(opts, clickFn){
  var h='';
  opts.forEach(function(o,idx){
    h+='<button class="qopt" data-i="'+idx+'"'+(o.is?' data-ok="1"':'')+'><span class="pos">'+o.pos+'</span>'+o.label+'</button>';
  });
  return h;
}

function startQuiz(cfg){
  var words=[];
  (cfg.scenes||[]).forEach(function(s){ (s.w||[]).forEach(function(x){ if(words.indexOf(x)===-1 && VOCAB_MAP[x]) words.push(x); }); });
  var count=cfg.quiz||5;
  if(words.length===0){ var _keys=Object.keys(VOCAB_MAP); for(var _t=0;_t<10;_t++) words.push(_keys[rand(_keys.length)]); }
  var items=[];
  var spellCount=Math.max(1,Math.floor(count*0.3));
  for(var i=0;i<count;i++){
    var w=words[i%words.length];
    if(i>=words.length){
      var keys=Object.keys(VOCAB_MAP);
      for(var t=0;t<60;t++){
        var k=keys[rand(keys.length)];
        if(k!==w && words.indexOf(k)===-1){w=k;break;}
      }
    }
    var isSpell=(i>=count-spellCount);
    if(isSpell){
      items.push({word:w,mode:'spell',type:'spell',options:null});
    }else{
      var mode=(i%2===0)?'en2zh':'zh2en';
      items.push({word:w,mode:mode,type:'choice',options:makeOptions(w,4,mode)});
    }
  }
  cur={stage:'quiz',items:items,i:0,gate:cfg.gateText,wrongCount:0,wrongWords:[],chapterCfg:cfg};
  renderQuiz();
}
function renderQuiz(){
  showPage('page-quiz');
  /* 重置结果面板 */
  var rb=$('quizResult'); if(rb){rb.style.display='none';rb.innerHTML='';}
  var qOptsEl=$('qOpts'); if(qOptsEl) qOptsEl.style.display='block';
  var qSpellEl=$('qSpell'); if(qSpellEl) qSpellEl.style.display='none';
  var it=cur.items[cur.i];
  var p=extractPOS(VOCAB_MAP[it.word].def);
  /* 角色台词 */
  var charIdx=S.chapter%3;
  var charData=CHARACTERS[charIdx]||CHARACTERS[0];
  var charBox=$('quizChar');
  if(charBox){
    charBox.style.display='flex';
    var ci=$('quizCharImg');
    if(ci){ ci.src=charData.img; ci.alt=charData.name; }
    var lines=QUIZ_LINES[charIdx]||QUIZ_LINES[0];
    $('quizCharLine').textContent='\u201c'+lines[rand(lines.length)]+'\u201d';
  }
  var dots='';
  for(var i=0;i<cur.items.length;i++){
    dots+='<div class="pdot'+(i<cur.i?' done':(i===cur.i?' cur':''))+'"></div>';
  }
  $(ui.quizProgress).innerHTML=dots;
  if(it.type==='spell'){
    /* 拼写题：显示中文释义，输入英文 */
    $(ui.qOpts).style.display='none';
    $('qSpell').style.display='block';
    $(ui.qWord).textContent='';
    $(ui.qPho).textContent='';
    $(ui.qPos).textContent='\u62fc\u5199 \u00b7 \u770b\u4e49\u5199\u8bcd';
    $('spellHint').textContent=p.mean;
    var input=$('spellInput');
    input.value=''; input.className='spell-input'; input.disabled=false;
    $('spellSubmit').disabled=false;
    $('spellTip').textContent='\u9996\u5b57\u6bcd\uff1a'+it.word.charAt(0).toUpperCase()+'  \u00b7  \u5171 '+it.word.length+' \u4e2a\u5b57\u6bcd';
    setTimeout(function(){try{input.focus();}catch(e){}},120);
  }else{
    /* 选择题 */
    $('qSpell').style.display='none';
    $(ui.qOpts).style.display='block';
    if(it.mode==='zh2en'){
      $(ui.qWord).textContent=p.mean;
      $(ui.qPho).textContent='';
      $(ui.qPos).textContent=p.pos+' \u00b7 \u770b\u4e49\u9009\u8bcd';
    }else{
      $(ui.qWord).textContent=it.word;
      $(ui.qPho).textContent=VOCAB_MAP[it.word].phonetic||'';
      $(ui.qPos).textContent=p.pos+' \u00b7 \u9009\u8bcd\u4e49';
    }
    $(ui.qOpts).innerHTML=buildOptsHTML(it.options,function(){});
    var opts=$(ui.qOpts).querySelectorAll('.qopt');
    for(var j=0;j<opts.length;j++){
      opts[j].onclick=function(){ answerQuiz(this.getAttribute('data-i')); };
    }
  }
  $(ui.quizHint).textContent=cur.i===0&&cur.gate?cur.gate:'';
}
function answerQuiz(idx){
  if(!cur||cur.stage!=='quiz') return;
  var it=cur.items[cur.i];
  var o=it.options[parseInt(idx,10)];
  var isRight=!!o.is;
  var qopt=$(ui.qOpts).querySelectorAll('.qopt')[parseInt(idx,10)];
  if(qopt){
    qopt.classList.add(isRight?'right':'wrong');
    if(!isRight){
      for(var k=0;k<it.options.length;k++) if(it.options[k].is){
        $(ui.qOpts).querySelectorAll('.qopt')[k].classList.add('right');
        break;
      }
    }
  }
  if(isRight){
    S.right++; S.streak++; if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    var gain=10*(S.streak>1?2:1);
    S.points+=gain;
    try{ if(!S.seen[it.word]){S.seen[it.word]=1; taskInc('words');} }catch(e){}
    taskInc('correct');
    toast('答对了 +'+gain+' 圣宠'+(S.streak>1?'（连击×2）':''));
    spawnCoin(qopt||$(ui.qWord),'✨');
  }else{
    S.wrong++; S.streak=0; S.points=Math.max(0,S.points-5);
    cur.wrongCount++;
    if(cur.wrongWords.indexOf(it.word)===-1) cur.wrongWords.push(it.word);
    toast('答错了 -5 圣宠');
    spawnCoin(qopt||$(ui.qWord),'💔');
  }
  save();
  var opts=$(ui.qOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].style.pointerEvents='none';
  setTimeout(function(){
    if(!cur||cur.stage!=='quiz') return;
    cur.i++;
    if(cur.i>=cur.items.length){
      finishQuiz();
    }else{
      renderQuiz();
    }
  },900);
}
function answerSpell(){
  if(!cur||cur.stage!=='quiz') return;
  var it=cur.items[cur.i];
  if(it.type!=='spell') return;
  var input=$('spellInput');
  var val=(input.value||'').trim().toLowerCase();
  var correct=it.word.toLowerCase();
  var isRight=(val===correct);
  input.disabled=true;
  $('spellSubmit').disabled=true;
  if(isRight){
    input.className='spell-input right';
    S.right++; S.streak++; if(S.streak>S.bestStreak)S.bestStreak=S.streak;
    var gain=15*(S.streak>1?2:1);
    S.points+=gain;
    try{ if(!S.seen[it.word]){S.seen[it.word]=1; taskInc('words');} }catch(e){}
    taskInc('correct');
    toast('\u62fc\u5199\u6b63\u786e +'+gain+' \u5723\u5ba0'+(S.streak>1?'\uff08\u8fde\u51fb\u00d72\uff09':''));
    spawnCoin(input,'\u2728');
  }else{
    input.className='spell-input wrong';
    input.value=correct;
    S.wrong++; S.streak=0; S.points=Math.max(0,S.points-5);
    cur.wrongCount++;
    if(cur.wrongWords.indexOf(it.word)===-1) cur.wrongWords.push(it.word);
    toast('\u62fc\u5199\u9519\u8bef -5 \u5723\u5ba0');
    spawnCoin(input,'\ud83d\udc94');
  }
  save();
  setTimeout(function(){
    if(!cur||cur.stage!=='quiz') return;
    cur.i++;
    if(cur.i>=cur.items.length){
      finishQuiz();
    }else{
      renderQuiz();
    }
  },1500);
}
function finishQuiz(){
  var total=cur.items.length;
  var correctCount=total-cur.wrongCount;
  var passLine=Math.ceil(total*0.6); /* 60%通过线 */
  var passed=correctCount>=passLine;
  var wrongWords=cur.wrongWords||[];
  var cfg=cur.chapterCfg;

  if(passed){
    /* 隐藏角色台词和考校内容，显示通过结果 */
    var charBox=$('quizChar'); if(charBox) charBox.style.display='none';
    var qPanel=$('qOpts'); if(qPanel) qPanel.style.display='none';
    var qSpell=$('qSpell'); if(qSpell) qSpell.style.display='none';
    $(ui.quizHint).textContent='';
    var resBox=$('quizResult');
    resBox.style.display='block';
    resBox.innerHTML='<div class="quiz-result">'+
      '<div class="result-stamp pass">'+(wrongWords.length===0?'考校全通':'考校通过')+'</div>'+
      '<div class="result-score">答对 <b>'+correctCount+'</b> / '+total+' 题'+(wrongWords.length>0?' · 错'+wrongWords.length+'词需复习':'')+'</div>'+
      (wrongWords.length>0?
        '<div class="result-wrong-title">错词复习（点单词可听发音）</div>'+
        '<div class="result-wrong-list">'+wrongWords.map(function(w){
          var d=VOCAB_MAP[w]?VOCAB_MAP[w].def:'';
          return '<div class="result-wrong-item"><span class="result-word" onclick="speak(\''+w+'\')" style="cursor:pointer">'+w+' 🔊</span><div class="result-def">'+d+'</div></div>';
        }).join('')+'</div>':'')+
      '<button class="btn gold" id="quizContinueBtn" style="margin-top:6px">继续剧情</button>'+
    '</div>';
    var btn=$('quizContinueBtn');
    if(btn) btn.onclick=function(){
      resBox.style.display='none';
      resBox.innerHTML='';
      if(charBox) charBox.style.display='flex';
      if(qPanel) qPanel.style.display='block';
      cur=null;
      afterGate(true);
    };
  }else{
    /* 失败：不重置剧情，显示错词复习+重试 */
    var charBox2=$('quizChar'); if(charBox2) charBox2.style.display='none';
    var qPanel2=$('qOpts'); if(qPanel2) qPanel2.style.display='none';
    var qSpell2=$('qSpell'); if(qSpell2) qSpell2.style.display='none';
    $(ui.quizHint).textContent='';
    var resBox2=$('quizResult');
    resBox2.style.display='block';
    resBox2.innerHTML='<div class="quiz-result">'+
      '<div class="result-stamp fail">考校未过</div>'+
      '<div class="result-score">答对 <b>'+correctCount+'</b> / '+total+' 题 · 需 '+passLine+' 题通过</div>'+
      '<div class="result-wrong-title">错词复习（点单词可听发音），记住后重新考校</div>'+
      '<div class="result-wrong-list">'+wrongWords.map(function(w){
        var d=VOCAB_MAP[w]?VOCAB_MAP[w].def:'';
        return '<div class="result-wrong-item"><span class="result-word" onclick="speak(\''+w+'\')" style="cursor:pointer">'+w+' 🔊</span><div class="result-def">'+d+'</div></div>';
      }).join('')+'</div>'+
      '<button class="btn gold" id="quizRetryBtn" style="margin-top:6px">重新考校</button>'+
    '</div>';
    var btn2=$('quizRetryBtn');
    if(btn2) btn2.onclick=function(){
      resBox2.style.display='none';
      resBox2.innerHTML='';
      if(charBox2) charBox2.style.display='flex';
      if(qPanel2) qPanel2.style.display='block';
      cur=null;
      if(cfg) startQuiz(cfg);
    };
  }
}

/* ---------- 斗法（战斗化测验） ---------- */
function startBattle(cfg){
  cur={stage:'battle',enemy:cfg.enemy,hp:100,myhp:100,count:6,i:0,log:''};
  nextBattleQ();
}
function nextBattleQ(){
  var keys=Object.keys(VOCAB_MAP);
  var w=keys[rand(keys.length)];
  cur.q={word:w,mode:'en2zh',options:makeOptions(w,3,'en2zh')};
  renderBattle();
}
function renderBattle(){
  showPage('page-battle');
  $(ui.battleTitle).textContent='斗法 · 对阵'+cur.enemy;
  $(ui.battleSub).textContent='答对出招，连击翻倍；答错受挫，圣宠受损';
  var c=findCharByName(cur.enemy);
  var ec=$('enemyChar');
  if(c && ec){
    ec.style.display='flex';
    $('enemyCharImg').src=c.img;
    $('enemyCharImg').alt=c.name;
    $('enemyCharName').textContent=c.name;
    $('enemyCharQuote').textContent='"'+c.quote+'"';
  }else if(ec){ ec.style.display='none'; }
  $(ui.enemyName).textContent=cur.enemy;
  $(ui.enemyHp).style.width=Math.max(0,cur.hp)+'%';
  $(ui.enemyHpText).textContent=Math.max(0,cur.hp)+'/100';
  $(ui.myHp).style.width=Math.max(0,cur.myhp)+'%';
  $(ui.myHpText).textContent=Math.max(0,cur.myhp)+'/100';
  var p=extractPOS(VOCAB_MAP[cur.q.word].def);
  $(ui.bWord).textContent=cur.q.word;
  $(ui.bPho).textContent=VOCAB_MAP[cur.q.word].phonetic||'';
  $(ui.bPos).textContent=p.pos;
  $(ui.bOpts).innerHTML=buildOptsHTML(cur.q.options,function(){});
  var opts=$(ui.bOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].onclick=function(){ answerBattle(this.getAttribute('data-i')); };
  $(ui.battleLog).textContent=cur.log;
}
function answerBattle(idx){
  if(!cur||cur.stage!=='battle') return;
  var o=cur.q.options[parseInt(idx,10)];
  var isRight=!!o.is;
  var qopt=$(ui.bOpts).querySelectorAll('.qopt')[parseInt(idx,10)];
  qopt.classList.add(isRight?'right':'wrong');
  if(!isRight){
    for(var k=0;k<cur.q.options.length;k++) if(cur.q.options[k].is){
      $(ui.bOpts).querySelectorAll('.qopt')[k].classList.add('right'); break;
    }
  }
  var opts=$(ui.bOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].style.pointerEvents='none';
  if(isRight){
    S.right++; S.streak++; if(S.streak>S.bestStreak) S.bestStreak=S.streak;
    var dmg=20+(S.streak>2?15:0);
    cur.hp-=dmg; S.points+=12;
    cur.log='你一道见招拆招，'+cur.enemy+'气血震荡 -'+dmg;
    taskInc('correct');
    toast('施计成功！连击'+S.streak);
  }else{
    S.wrong++; S.streak=0;
    cur.myhp-=25; S.points=Math.max(0,S.points-8);
    cur.log=cur.enemy+'反将一军："就这点本事？" 你-25';
    toast('计谋被识破 -8 圣宠');
  }
  save();
  setTimeout(function(){
    if(!cur||cur.stage!=='battle') return;
    if(cur.hp<=0){ winBattle(); }
    else if(cur.myhp<=0){ loseBattle(); }
    else { cur.i++; nextBattleQ(); }
  },900);
}
function winBattle(){
  if(!cur||cur.stage!=='battle') return;
  cur=null;
  var ec=$('enemyChar'); if(ec) ec.style.display='none';
  toast('你赢了！');
  $(ui.battleLog).textContent='你在六宫面前立住了脚跟。';
  setTimeout(function(){ afterGate(true); },800);
}
function loseBattle(){
  var ec=$('enemyChar'); if(ec) ec.style.display='none';
  $(ui.battleLog).textContent='你暂时落败……重整旗鼓再来一次。';
  setTimeout(function(){
    cur=null;
    var btn=document.createElement('button');
    btn.className='btn gold'; btn.textContent='重新斗法';
    btn.onclick=function(){
      btn.remove();
      var ch=STORY[S.chapter];
      if(ch&&ch.battle) startBattle(ch.battle);
    };
    var log=$('battleLog').parentNode;
    log.appendChild(btn);
  },1000);
}

/* ---------- 抉择（考词） ---------- */
function showChoice(cfg){
  cur={stage:'choice',cfg:cfg,answered:false};
  showPage('page-choice');
  $(ui.choiceTitle).textContent=STORY[S.chapter].title;
  $(ui.choiceText).innerHTML=linkWords(cfg.q,STORY[S.chapter].scenes.reduce(function(a,s){return a.concat(s.w);},[]));
  bindWordClicks($(ui.choiceText));
  var h='';
  cfg.opts.forEach(function(o,idx){
    var it=VOCAB_MAP[o.k]; var pos='';
    if(it){ var p=extractPOS(it.def); pos=p.pos||''; }
    h+='<button class="qopt" data-i="'+idx+'"'+(o.k===cfg.good?' data-ok="1"':'')+'><span class="pos">'+(pos?pos+' ':'')+'</span>'+o.t+'</button>';
  });
  $(ui.choiceOpts).innerHTML=h;
  var opts=$(ui.choiceOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].onclick=function(){ answerChoice(this.getAttribute('data-i')); };
  $(ui.choiceHint).textContent='抉择的关键词已在文中标红，点开即看释义。';
}
function answerChoice(idx){
  if(cur.answered) return;
  cur.answered=true;
  var cfg=cur.cfg;
  var o=cfg.opts[parseInt(idx,10)];
  var isGood=(o.k===cfg.good);
  var qopt=$(ui.choiceOpts).querySelectorAll('.qopt')[parseInt(idx,10)];
  qopt.classList.add(isGood?'right':'wrong');
  if(!isGood){
    for(var k=0;k<cfg.opts.length;k++) if(cfg.opts[k].k===cfg.good){
      $(ui.choiceOpts).querySelectorAll('.qopt')[k].classList.add('right'); break;
    }
  }
  S.verdict.push({c:cfg.q.slice(0,40)+'…',good:isGood,t:o.t});
  if(isGood){ S.points+=20; S.right++; S.streak++; if(S.streak>S.bestStreak)S.bestStreak=S.streak; taskInc('correct'); toast('抉择正确 +20 圣宠'); }
  else{ S.points=Math.max(0,S.points-10); S.wrong++; S.streak=0; toast('抉择失当 -10 圣宠'); }
  save();
  var opts=$(ui.choiceOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].style.pointerEvents='none';
  setTimeout(function(){
    $(ui.choiceText).innerHTML='<p class="p-text" style="text-indent:0">'+(isGood?cfg.goodText:cfg.badText)+'</p>';
    $(ui.choiceOpts).style.display='none';
    $(ui.choiceHint).textContent='';
    var b=document.createElement('button');
    b.className='btn gold'; b.textContent='继续';
    b.onclick=function(){ b.remove(); afterGate(isGood); };
    $(ui.choiceHint).parentNode.appendChild(b);
  },900);
}

  var opts=$(ui.caseOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].onclick=function(){ answerCase(this.getAttribute('data-i')); };
  $(ui.caseHint).textContent='点密信里的词可看释义，再作答。';
}
function answerCase(idx){
  if(cur.answered) return;
  cur.answered=true;
  var cfg=cur.cfg;
  var o=cfg.opts[parseInt(idx,10)];
  var isGood=!!o.good;
  var qopt=$(ui.caseOpts).querySelectorAll('.qopt')[parseInt(idx,10)];
  qopt.classList.add(isGood?'right':'wrong');
  if(!isGood){
    for(var k=0;k<cfg.opts.length;k++) if(cfg.opts[k].good){
      $(ui.caseOpts).querySelectorAll('.qopt')[k].classList.add('right'); break;
    }
  }
  if(isGood){ S.points+=25; S.right++; S.streak++; if(S.streak>S.bestStreak)S.bestStreak=S.streak; taskInc('correct'); toast('查明真相 +25 圣宠'); }
  else{ S.points=Math.max(0,S.points-12); S.wrong++; S.streak=0; toast('误判了 -12 圣宠'); }
  save();
  var opts=$(ui.caseOpts).querySelectorAll('.qopt');
  for(var i=0;i<opts.length;i++) opts[i].style.pointerEvents='none';
  setTimeout(function(){
    $(ui.caseIntro).innerHTML='<p class="p-text" style="text-indent:0">'+(isGood?cfg.goodText:cfg.badText)+'</p>';
    $(ui.caseLetter).style.display='none';
    $(ui.caseQ).style.display='none';
    $(ui.caseOpts).style.display='none';
    $(ui.caseHint).textContent='';
    var b=document.createElement('button');
    b.className='btn gold'; b.textContent='继续';
    b.onclick=function(){ b.remove(); afterGate(isGood); };
    $(ui.caseHint).parentNode.appendChild(b);
  },900);
}

/* ---------- 章节流程 ---------- */
function startGame(){
  renderRankBar();
  S.chapter=0; S.step=0; S.storyIdx=0; save();
  openStory();
}
function openStory(){
  if(S.chapter>=STORY.length){ showPage('page-story'); $(ui.storyTitle).textContent='剧情已尽'; $(ui.storyText).textContent='你已通关全部章节！可去词库复习词汇。'; $(ui.btnStoryNext).style.display='none'; $(ui.storyHint).textContent=''; return; }
  var ch=STORY[S.chapter];
  showPage('page-story');
  // 角色头像
  var c=CHARACTERS[S.chapter];
  var cb=$('charBox');
  if(c && cb){
    cb.style.display='flex';
    var ci=$('charImg');
    if(ci){ ci.src=c.img; ci.alt=c.name; }
    $('charName').textContent=c.name;
    $('charQuote').textContent='"'+c.quote+'"';
  }else if(cb){ cb.style.display='none'; }
  $(ui.storyTitle).textContent=ch.title;
  $(ui.storySub).textContent=ch.sub;
  $(ui.btnStoryNext).style.display='block';
  $(ui.storyHint).textContent='';
  var s=ch.scenes[Math.min(S.storyIdx,ch.scenes.length-1)];
  $(ui.storyText).innerHTML=linkWords(s.t,s.w);
  bindWordClicks();
  if(S.storyIdx>=ch.scenes.length){
    $(ui.storyText).innerHTML='<p class="p-text">'+(ch.gateText||'')+'</p>';
    $(ui.btnStoryNext).textContent=ch.quiz>0?'开始考校':'进入宫闱事件';
  }else{
    $(ui.btnStoryNext).textContent='继续';
  }
  setTab('story');
}
function storyNext(){
  if(S.chapter>=STORY.length) return;
  var ch=STORY[S.chapter];
  if(S.storyIdx<ch.scenes.length-1){
    S.storyIdx++; save(); openStory();
    return;
  }
  // 场景走完 → 按章内顺序推进未完成事件
  var done=ch._done||{};
  if(ch.quiz>0 && !done.quiz){ startQuiz(ch); return; }
  if(ch.battle && !done.battle){ startBattle(ch.battle); return; }
  if(ch.choice && !done.choice){ showChoice(ch.choice); return; }
  if(ch.case && !done.case){ showCase(ch.case); return; }
  afterGate(true);
}
function afterGate(ok){
  if(S.chapter>=STORY.length){ openStory(); return; }
  var ch=STORY[S.chapter];
  // 按章内顺序推进：quiz → battle → choice → case → reward
  var done=ch._done||{};
  if(ch.quiz>0 && !done.quiz){ done.quiz=true; ch._done=done; if(ok){ openStory(); return; } }
  if(ch.battle && !done.battle){ done.battle=true; ch._done=done; openStory(); return; }
  if(ch.choice && !done.choice){ done.choice=true; ch._done=done; openStory(); return; }
  if(ch.case && !done.case){ done.case=true; ch._done=done; openStory(); return; }
  // 全部完成 → 晋升
  if(S.rank<ch.reward) promote(ch.reward);
  else { S.chapter++; S.storyIdx=0; S.step=0; if(ch._done) delete ch._done; save(); openStory(); }
}
function promote(rank){
  S.rank=rank;
  taskInc('promote');
  var ch=STORY[S.chapter];
  if(ch._done) delete ch._done;
  showPage('page-reward');
  $(ui.rewardFrom).textContent='获赐第 '+rank+' 枚凤印 · 晋位大典';
  $(ui.rewardRank).textContent=RANKS[rank].n;
  $(ui.rewardRank).className='rn seal-stamp';
  setTimeout(function(){$(ui.rewardRank).className='rn';},600);
  $(ui.rewardSlogan).textContent=RANKS[rank].s;
  $(ui.rewardText).textContent=rank===RANKS.length-1
    ?'九枚凤印尽收，百官朝贺。你终于站到了这深宫之巅——可你心里清楚，这不过是另一场修行开始。'
    :'内侍捧着鎏金凤印走到你面前，宫人纷纷跪下请安。你想起母亲那句"深宫险恶"——你活下来了，而且还要活得更好。';
  $(ui.btnRewardNext).textContent='进入第'+(S.chapter+2)+'章';
  renderRankBar();
}
function rewardNext(){
  S.chapter++; S.storyIdx=0; S.step=0; save();
  if(S.chapter>=STORY.length){
    openStory();
  }else{
    openStory();
  }
}

/* ---------- 词库 ---------- */
function renderLibrary(q){
  var kw=(q||'').trim().toLowerCase();
  var list=$(ui.libList);
  if(!kw){
    var keys=Object.keys(VOCAB_MAP).slice(0,60);
    list.innerHTML=keys.map(function(k){return libItem(k);}).join('');
  }else{
    var hits=[];
    var all=Object.keys(VOCAB_MAP);
    for(var i=0;i<all.length;i++){
      if(all[i].indexOf(kw)>-1){ hits.push(all[i]); if(hits.length>=40) break; }
    }
    list.innerHTML=hits.length?hits.map(function(k){return libItem(k);}).join(''):'<div class="lib-empty">没有找到这个词，换个拼写试试</div>';
  }
  bindLibClicks(list);
  $(ui.libTotal).textContent=Object.keys(VOCAB_MAP).length;
  $(ui.libKnow).textContent=Object.keys(S.seen||{}).length;
}
function libItem(k){
  var it=VOCAB_MAP[k]; var p=extractPOS(it.def);
  return '<div class="lib-item" data-w="'+k+'"><span class="w">'+it.word+'</span><span class="d"><span class="pos">'+p.pos+'</span>'+p.mean+'</span></div>';
}
function bindLibClicks(list){
  var items=list.querySelectorAll('.lib-item');
  for(var i=0;i<items.length;i++){
    items[i].onclick=function(){ openSheet(this.getAttribute('data-w')); };
  }
}

/* ---------- 藏录 & 宫册 ---------- */
function renderRecord(){
  var list=$(ui.recList);
  if(!S.verdict.length){
    list.innerHTML='<div class="lib-empty">尚未做出抉择。走到剧情岔路口时，你的选择会记在这里。</div>';
    return;
  }
  var h='';
  S.verdict.slice().reverse().forEach(function(v){
    h+='<div class="rec-item"><div class="q">'+v.c+'</div><div class="a'+(v.good?'':' bad')+'">'+(v.good?'✓ 你选了：「'+v.t+'」':'✗ 你选了：「'+v.t+'」')+'</div></div>';
  });
  list.innerHTML=h;
}
function renderStats(){
  $(ui.stRight).textContent=S.right;
  $(ui.stWrong).textContent=S.wrong;
  $(ui.stStreak).textContent=S.bestStreak;
}
function resetGame(){
  if(!confirm('确定重入轮回？当前进度将被清空。')) return;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
}

/* ---------- 初始化 ---------- */
function init(){
  ui={
    toast:'toast',rankBar:'rankBar',rankName:'rankName',favText:'favText',
    storyTitle:'storyTitle',storySub:'storySub',storyText:'storyText',
    btnStoryNext:'btnStoryNext',storyHint:'storyHint',
    quizProgress:'quizProgress',qWord:'qWord',qPho:'qPho',qPos:'qPos',qOpts:'qOpts',quizHint:'quizHint',
    battleTitle:'battleTitle',battleSub:'battleSub',enemyName:'enemyName',enemyHp:'enemyHp',enemyHpText:'enemyHpText',
    myHp:'myHp',myHpText:'myHpText',bWord:'bWord',bPho:'bPho',bPos:'bPos',bOpts:'bOpts',battleLog:'battleLog',
    choiceTitle:'choiceTitle',choiceText:'choiceText',choiceOpts:'choiceOpts',choiceHint:'choiceHint',
    caseTitle:'caseTitle',caseIntro:'caseIntro',caseLetter:'caseLetter',caseQ:'caseQ',caseOpts:'caseOpts',caseHint:'caseHint',
    rewardFrom:'rewardFrom',rewardRank:'rewardRank',rewardSlogan:'rewardSlogan',rewardText:'rewardText',btnRewardNext:'btnRewardNext',
    libSearch:'libSearch',libList:'libList',libTotal:'libTotal',libKnow:'libKnow',
    recList:'recList',stRight:'stRight',stWrong:'stWrong',stStreak:'stStreak',
    sheetMask:'sheetMask',sWord:'sWord',sPho:'sPho',sDef:'sDef'
  };
  var has=load();
  renderTasks();
  renderRankBar();
  if(has && S.chapter>0){
    // 有进度 → 回到封面，用户点"继续"由 tab 剧情进入
  }
  renderLibrary('');
  showPage('page-start');
}
window.startGame=startGame;
window.storyNext=storyNext;
window.rewardNext=rewardNext;
window.goTab=goTab;
window.openSheet=openSheet;
window.closeSheet=closeSheet;
window.speakSheet=speakSheet;
window.renderLibrary=renderLibrary;
window.resetGame=resetGame;
window.answerSpell=answerSpell;
window.speakWord=speakWord;
window.speakSpell=speakSpell;
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
})();
</script>
